<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d14" />
    <title>Le Mytho — Rejoindre une partie</title>
    <style>
      :root {
        --bg: #1b1e24;
        --surface: #1a1a26;
        --surface-variant: #2f3540;
        --text: #eceff1;
        --text-muted: #9ea7b3;
        --primary: #00b8d4;
        --on-primary: #1b1e24;
      }
      @font-face {
        font-family: "Special Elite";
        src: url("/fonts/special_elite.ttf") format("truetype");
        font-display: swap;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background-color: var(--bg);
        background-image: url("/images/home_bg.webp");
        background-repeat: no-repeat;
        background-position: center bottom;
        background-size: cover;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      @media (min-width: 641px) {
        body {
          background-position: center;
          background-size: auto 100%;
        }
        .card {
          max-width: min(400px, 42vh);
        }
      }
      h1 {
        font-family: "Special Elite", "Courier New", monospace;
        font-size: 3rem;
        margin: 0 0 8px;
        letter-spacing: 0.06em;
      }
      .subtitle {
        color: var(--text-muted);
        margin: 0 0 24px;
      }
      .code {
        display: inline-block;
        font-family: "Special Elite", "Courier New", monospace;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        padding: 8px 20px;
        margin-bottom: 24px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 10px;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 14px 16px;
        margin: 10px 0;
        font-size: 1.05rem;
        font-weight: 600;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        text-decoration: none;
        color: var(--on-primary);
        background: var(--primary);
      }
      .btn.secondary {
        background: var(--surface-variant);
        color: var(--text);
      }
      .hint {
        color: var(--text-muted);
        font-size: 0.85rem;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Le Mytho</h1>
      <p class="subtitle">Tu as été invité à rejoindre une partie</p>
      <div class="code" id="code">----</div>

      <button class="btn" id="open-app">Ouvrir l'app</button>
      <a class="btn secondary" id="play-web" href="/" style="display:block;">Jouer dans le navigateur</a>
      <a class="btn secondary" id="download-apk" href="/apk/LeMytho-latest.apk" style="display:block;">Télécharger l'app</a>

      <p class="hint">Sans l'app, tu peux jouer directement dans ton navigateur.</p>
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = (params.get("code") || "").trim().toUpperCase();
        var server = window.location.origin;

        var codeEl = document.getElementById("code");
        codeEl.textContent = code || "----";

        if (code) {
          document.getElementById("play-web").href = "/?code=" + encodeURIComponent(code);

          // Deep link vers l'app (l'app a besoin du serveur pour se connecter).
          var deepLink =
            "lemytho://join?code=" +
            encodeURIComponent(code) +
            "&server=" +
            encodeURIComponent(server);

          document.getElementById("open-app").addEventListener("click", function () {
            window.location.href = deepLink;
          });

          // Tentative en parallèle (best-effort) via une iframe invisible :
          // ouvre l'app si elle est installée, sinon ne fait rien.
          try {
            var iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = deepLink;
            document.body.appendChild(iframe);
            setTimeout(function () {
              document.body.removeChild(iframe);
            }, 2000);
          } catch (e) {
            /* ignore */
          }
        } else {
          document.getElementById("open-app").style.display = "none";
        }
      })();
    </script>
  </body>
</html>
