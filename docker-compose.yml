services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - lemytho

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LEMYTHO_DOMAIN: ${LEMYTHO_DOMAIN:-lemytho.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    networks:
      - lemytho

networks:
  lemytho:

volumes:
  caddy_data:
  caddy_config:
